<header class="cabecera">
  <a class="cabecera__logo" routerLink="/">3Vetas</a>
  <nav class="cabecera__nav" aria-label="Principal">
    <ul class="menu">
      @for (enlace of enlaces; track enlace.ruta) {
        <li class="menu__item">
          <a
            class="menu__enlace"
            [routerLink]="enlace.ruta"
            routerLinkActive="menu__enlace--activo"
            [routerLinkActiveOptions]="{ exact: enlace.ruta === '/' }"
          >
            {{ enlace.texto }}
          </a>
        </li>
      }
    </ul>
  </nav>
  <a class="boton boton--secundario cabecera__acceso" routerLink="/login">Entrar</a>
</header>
