@let medidas = formato();
@let tableroFisico = unidad();
<svg
  class="plano-corte"
  role="img"
  [attr.viewBox]="'0 0 ' + medidas.anchoMm + ' ' + medidas.altoMm"
  [attr.aria-label]="
    'Tablero ' +
    tableroFisico.numeroTablero +
    ' con ' +
    tableroFisico.distribucion.length +
    ' piezas'
  "
>
  <rect
    class="plano-corte__tablero"
    [attr.width]="medidas.anchoMm"
    [attr.height]="medidas.altoMm"
    fill="#d0d0d0"
    stroke="currentColor"
    stroke-width="2"
    vector-effect="non-scaling-stroke"
  />
  @for (colocada of tableroFisico.distribucion; track colocada.ordenDibujo) {
    @let pieza = piezas()[colocada.indicePieza];
    <rect
      class="plano-corte__pieza"
      [attr.x]="colocada.posicionXMm"
      [attr.y]="colocada.posicionYMm"
      [attr.width]="colocada.anchoFinalMm"
      [attr.height]="colocada.altoFinalMm"
      [attr.fill]="color()"
      stroke="currentColor"
      stroke-width="1"
      vector-effect="non-scaling-stroke"
    >
      <title>
        {{ pieza.descripcion }} · {{ pieza.anchoMm }} × {{ pieza.altoMm }} mm
        {{ colocada.rotada ? '(girada)' : '' }}
      </title>
    </rect>
    <!-- Este svg recorta el texto para que no se salga de la pieza. -->
    <svg
      [attr.x]="colocada.posicionXMm"
      [attr.y]="colocada.posicionYMm"
      [attr.width]="colocada.anchoFinalMm"
      [attr.height]="colocada.altoFinalMm"
    >
      <text
        class="plano-corte__texto"
        x="50%"
        y="50%"
        text-anchor="middle"
        [attr.font-size]="tamanoLetra(colocada, pieza)"
      >
        <tspan x="50%" dy="-0.2em">{{ pieza.descripcion }}</tspan>
        <tspan x="50%" dy="1.2em">
          {{ pieza.anchoMm }} × {{ pieza.altoMm }}{{ colocada.rotada ? ' ↻' : '' }}
        </tspan>
      </text>
    </svg>
  }
</svg>
